plugins {
	id "com.crystaelix.loom" version "1.13-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
			includeGroup "vazkii.patchouli"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jeidrawables"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.modmuss50.me/"
			}
		}
		filter {
			includeGroup "teamreborn"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://server.bbkr.space/artifactory/libs-release/"
			}
		}
		filter {
            includeGroup "io.github.cottonmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.draylar.dev/releases/"
			}
		}
		filter {
            includeGroup "dev.draylar.omega-config"
			includeGroup "dev.draylar"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://jitpack.io/"
			}
		}
		filter {
			includeGroup "com.github.emilyploszaj"
		}
	}
}

def mcVersion = "1.20.1"
def modName = "IndRevJEI"
def modId = "indrevjei"
def specVersion = "20.1"
def vendor = "thelm"

group = "thelm.indrevjei"
version = "20.1.0"

def archivesName = modName
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.20.1"
	mappings loom.layered {
		officialMojangMappings {
			nameSyntheticMembers = false
		}
		parchment "org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip"
	}
	modImplementation "net.fabricmc:fabric-loader:0.18.1"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.7+1.20.1"
	modImplementation "eu.pb4:placeholder-api:2.1.4+1.20.1"
	modImplementation "com.terraformersmc:modmenu:7.2.2"

	// JEI
	modImplementation("mezz.jei:jei-1.20.1-fabric:15.20.0.129") {transitive = false}
	include(modImplementation("thelm.jeidrawables:JEIDrawables-Fabric:20.1.4"))

	// Industrial Revolution External Dependencies
	modImplementation "net.fabricmc:fabric-language-kotlin:1.13.7+kotlin.2.2.21"
	modImplementation "vazkii.patchouli:Patchouli:1.20.1-84.1-FABRIC"

	// Industrial Revolution Included Dependencies
	modImplementation "teamreborn:energy:3.0.0"
	modImplementation "io.github.cottonmc:LibGui:8.1.1+1.20.1"
	modImplementation "dev.draylar.omega-config:omega-config-base:1.4.0+1.20.1"
	modImplementation("dev.draylar:magna:1.10.1+1.20.1") {transitive = false}
	modImplementation "com.github.emilyploszaj:step-height-entity-attribute:1.2.0"

	// Industrial Revolution
	modImplementation "curse.maven:industrial-revolution-391708:5254377"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact remapSourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = project.version
	changelog = file("changelog.md").text
	type = STABLE
	modLoaders.add("fabric")
	additionalFiles.from(remapSourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1320886"
		minecraftVersions.add(mcVersion)
		requires "jei", "industrial-revolution"
		incompatible "roughly-enough-items-hacks", "extra-mod-integrations", "industrial-revolution-emi-plugin"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "dxJ23KIQ"
		minecraftVersions.add(mcVersion)
		requires "jei", "industrial-revolution"
		incompatible "roughly-enough-items-hacks", "extra-mod-integrations", "industrial-revolution-emi-plugin"
	}
}
