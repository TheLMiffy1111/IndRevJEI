plugins {
	id "com.crystaelix.loom" version "1.10.0"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "net.kyori.blossom" version "[1,2)"
	id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
			includeGroup "vazkii.patchouli"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jeidrawables"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.cafeteria.dev/releases/"
			}
		}
		filter {
			includeGroup "dev.cafeteria"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.modmuss50.me/"
			}
		}
		filter {
			includeGroup "teamreborn"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://server.bbkr.space/artifactory/libs-release/"
			}
		}
		filter {
            includeGroup "io.github.cottonmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://mod-buildcraft.com/maven/"
			}
		}
		filter {
            includeGroup "alexiil.mc.lib"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.draylar.dev/releases/"
			}
		}
		filter {
            includeGroup "draylar.omega-config"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://jitpack.io/"
			}
		}
		filter {
			includeGroup "com.github.Draylar"
			includeGroup "com.github.emilyploszaj"
		}
	}
}

def mcVersion = "1.18.2"
def modName = "IndRevJEI"
def modId = "indrevjei"
def specVersion = "18.2"
def vendor = "thelm"

group = "thelm.indrevjei"
version = "18.2.0"

archivesBaseName = modName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	mixin.defaultRefmapName = "${modId}.refmap.json"
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
}

dependencies {
	// Log4j
	implementation "org.apache.logging.log4j:log4j-core:2.24.3"

	// Minecraft
	minecraft "com.mojang:minecraft:1.18.2"
	mappings loom.layered {
		officialMojangMappings {
			nameSyntheticMembers = false
		}
		parchment "org.parchmentmc.data:parchment-1.18.2:2022.11.06@zip"
	}
	modImplementation "net.fabricmc:fabric-loader:0.17.2"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2"
	modImplementation "eu.pb4:placeholder-api:1.1.3+1.17.1"
	modImplementation "com.terraformersmc:modmenu:3.2.5"

	// JEI
	modImplementation("mezz.jei:jei-1.18.2-fabric:10.2.1.1009") {transitive = false}
	include(modImplementation("thelm.jeidrawables:JEIDrawables-Fabric:18.2.4"))

	// Industrial Revolution External Dependencies
	modImplementation "net.fabricmc:fabric-language-kotlin:1.13.4+kotlin.2.2.0"
	modImplementation "vazkii.patchouli:Patchouli:1.18.2-71.1-FABRIC"

	// Industrial Revolution Included Dependencies
	modImplementation "teamreborn:energy:2.3.0"
	modImplementation "io.github.cottonmc:LibGui:5.4.3+1.18.2"
	modImplementation "draylar.omega-config:omega-config-base:1.2.3-1.18.1"
	modImplementation("com.github.Draylar:magna:1.7.1-1.18") {transitive = false}
	modImplementation "alexiil.mc.lib:libblockattributes-all:0.10.2"
	modImplementation "com.github.emilyploszaj:step-height-entity-attribute:1.0.1"
	modImplementation "dev.cafeteria:fake-player-api:0.3.0"

	// Industrial Revolution
	modImplementation "curse.maven:industrial-revolution-391708:4195667"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesBaseName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesBaseName
			artifact remapJar
			artifact remapSourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = project.version
	changelog = file("changelog.md").text
	type = STABLE
	modLoaders.add("fabric")
	additionalFiles.from(remapSourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1320886"
		minecraftVersions.add(mcVersion)
		requires "jei", "industrial-revolution"
		incompatible "roughly-enough-items-hacks"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "dxJ23KIQ"
		minecraftVersions.add(mcVersion)
		requires "jei", "industrial-revolution"
		incompatible "roughly-enough-items-hacks"
	}
}
